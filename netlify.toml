[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/orbit-catalog"
  to = "/.netlify/functions/orbit-catalog"
  status = 200

[[redirects]]
  from = "/api/object-profile"
  to = "/.netlify/functions/object-profile"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
